<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Elevator Simulator</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      gap: 40px;
      align-items: flex-end;
    }

    .shaft {
      width: 120px;
      height: 500px;
      border: 4px solid #888;
      position: relative;
      background: linear-gradient(#333, #222);
      overflow: hidden;
    }

    .floor {
      position: absolute;
      width: 100%;
      height: 20%;
      border-top: 1px solid #555;
      box-sizing: border-box;
      color: #777;
      padding-left: 5px;
    }

    .elevator {
      width: 90px;
      height: 80px;
      background: linear-gradient(#bdbdbd, #7a7a7a);
      border: 3px solid #ddd;
      position: absolute;
      left: 12px;
      bottom: 0;
      transition: bottom 2s ease-in-out;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }

    .panel {
      display: grid;
      grid-template-columns: repeat(2, 80px);
      gap: 10px;
    }

    button {
      height: 60px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #444;
      color: white;
      transition: 0.2s;
    }

    button:hover {
      background: #666;
    }

    .display {
      grid-column: span 2;
      background: black;
      color: lime;
      text-align: center;
      font-size: 28px;
      padding: 10px;
      border-radius: 10px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shaft">
      <div class="floor" style="bottom:0%">1F</div>
      <div class="floor" style="bottom:20%">2F</div>
      <div class="floor" style="bottom:40%">3F</div>
      <div class="floor" style="bottom:60%">4F</div>
      <div class="floor" style="bottom:80%">5F</div>
      <div class="elevator" id="elevator"></div>
    </div>

    <div class="panel">
      <div class="display" id="display">1F</div>
      <button onclick="moveElevator(5)">5</button>
      <button onclick="moveElevator(4)">4</button>
      <button onclick="moveElevator(3)">3</button>
      <button onclick="moveElevator(2)">2</button>
      <button onclick="moveElevator(1)">1</button>
    </div>
  </div>

  <script>
    const elevator = document.getElementById('elevator');
    const display = document.getElementById('display');

    function moveElevator(floor) {
      const positions = {
        1: 0,
        2: 20,
        3: 40,
        4: 60,
        5: 80
      };

      elevator.style.bottom = positions[floor] + '%';
      display.textContent = floor + 'F';
    }
  </script>
</body>
</html>
