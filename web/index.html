<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>エレベーターシミュレーター</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>エレベーターシミュレーター（簡易）</h1>

  <div class="container">
    <div class="left">
      <div class="floor-buttons" id="floorButtons"></div>
    </div>
    <div class="right">
      <div class="shaft" id="shaft">
        <div class="elevator" id="elevator">🚪</div>
      </div>
    </div>
  </div>

  <p class="notes">操作: 左の階ボタンをクリックするとその階へ移動します。簡易シミュレーションです。</p>

  <script src="app.js"></script>
</body>
</html>
